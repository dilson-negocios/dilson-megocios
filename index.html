<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dilson Negócios - Gaming</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .neon-text { 
      text-shadow: 0 0 10px #22ff88, 0 0 20px #22ff88; 
    }
    .product-card { 
      transition: all 0.3s; 
    }
    .product-card:hover { 
      transform: translateY(-10px); 
      box-shadow: 0 0 30px rgba(34, 255, 136, 0.5); 
    }
  </style>
</head>
<body class="bg-zinc-950 text-white">

  <header class="bg-black border-b border-green-500 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-gamepad text-4xl text-green-400"></i>
        <h1 class="text-3xl font-bold neon-text">DILSON NEGÓCIOS</h1>
      </div>
      <nav class="flex gap-8 text-lg">
        <a href="#" class="hover:text-green-400">Início</a>
        <a href="#produtos" class="hover:text-green-400">Loja</a>
        <a href="#" onclick="toggleCart()" class="flex items-center gap-2 hover:text-green-400">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cart-count" class="bg-green-500 text-black text-sm px-2.5 py-0.5 rounded-full font-bold">0</span>
        </a>
      </nav>
    </div>
  </header>

  <section class="bg-gradient-to-r from-zinc-900 to-black py-24 text-center">
    <h2 class="text-6xl font-bold mb-4 neon-text">Os Melhores Produtos Gamers</h2>
    <p class="text-xl text-zinc-400">Qualidade • Preço justo • Entrega em Luanda</p>
  </section>

  <section id="produtos" class="max-w-7xl mx-auto px-6 py-16">
    <h2 class="text-4xl font-bold mb-12 text-center">Produtos em Destaque</h2>
    
    <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8" id="product-grid">
      </div>
  </section>

  <div id="cart-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
    <div class="bg-zinc-900 w-full max-w-lg mx-4 rounded-3xl p-8">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-3xl font-bold">Seu Carrinho</h3>
        <button onclick="toggleCart()" class="text-4xl hover:text-red-500">✕</button>
      </div>
      
      <div id="cart-items" class="space-y-6 mb-8 max-h-[400px] overflow-y-auto"></div>
      
      <div class="border-t border-zinc-700 pt-6">
        <div class="flex justify-between text-2xl mb-6">
          <span>Total:</span>
          <span id="cart-total" class="font-bold text-green-400">0 Kz</span>
        </div>
        <button onclick="finalizarCompra()" 
                class="w-full bg-green-500 hover:bg-green-600 text-black font-bold py-5 rounded-2xl text-xl transition">
          Finalizar Compra
        </button>
      </div>
    </div>
  </div>

  <script>
   const produtos = [
  { 
    id: 1, 
    nome: "Mouse Gamer RGB", 
    preco: 12500, 
    img: "https://picsum.photos/id/20/600/400" 
  },
  { 
    id: 2, 
    nome: "Teclado Mecânico RGB", 
    preco: 28500, 
    img: "https://picsum.photos/id/201/600/400" 
  },
  { 
    id: 3, 
    nome: "Headset Gamer 7.1", 
    preco: 32000, 
    img: "https://picsum.photos/id/180/600/400" 
  },
  { 
    id: 4, 
    nome: "Monitor 27\" 144Hz", 
    preco: 85000, 
    img: "https://picsum.photos/id/251/600/400" 
  },
  { 
    id: 5, 
    nome: "Cadeira Gamer Premium", 
    preco: 95000, 
    img: "https://picsum.photos/id/133/600/400" 
  },
  { 
    id: 6, 
    nome: "Controle PS5", 
    preco: 45000, 
    img: "https://picsum.photos/id/60/600/400" 
  }
];

    let carrinho = [];

    function renderProdutos() {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      grid.innerHTML = '';
      
      produtos.forEach(prod => {
        grid.innerHTML += `
          <div class="product-card bg-zinc-900 rounded-3xl overflow-hidden border border-zinc-800">
            <img src="${prod.img}" class="w-full h-52 object-cover">
            <div class="p-6">
              <h3 class="font-bold text-xl">${prod.nome}</h3>
              <p class="text-green-400 text-3xl font-bold mt-3">${prod.preco.toLocaleString('pt-AO')} Kz</p>
              <button onclick="adicionarAoCarrinho(${prod.id})" 
                      class="mt-6 w-full bg-green-500 hover:bg-green-600 text-black py-4 rounded-2xl font-bold text-lg">
                Adicionar ao Carrinho
              </button>
            </div>
          </div>
        `;
      });
    }

    function adicionarAoCarrinho(id) {
      const produto = produtos.find(p => p.id === id);
      const item = carrinho.find(i => i.id === id);
      
      if (item) item.quantidade++;
      else carrinho.push({...produto, quantity: 1, quantidade: 1});
      
      atualizarCarrinho();
      
      // Notificação Corrigida
      const notif = document.createElement('div');
      notif.style.cssText = 'position:fixed; bottom:20px; right:20px; background:#22ff88; color:black; padding:15px 25px; border-radius:9999px; font-weight:bold; z-index: 100;';
      notif.textContent = ${produto.nome} adicionado!;
      document.body.appendChild(notif);
      setTimeout(() => notif.remove(), 1800);
    }

    function atualizarCarrinho() {
      document.getElementById('cart-count').textContent = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
    }

    function toggleCart() {
      const modal = document.getElementById('cart-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;

      if (carrinho.length === 0) {
        container.innerHTML = <p class="text-center text-zinc-400 py-12 text-xl">Carrinho vazio...</p>;
        document.getElementById('cart-total').textContent = '0 Kz';
        return;
      }

      carrinho.forEach((item, index) => {
        total += item.preco * item.quantidade;
        container.innerHTML += `
          <div class="flex gap-4 bg-zinc-800 p-4 rounded-2xl">
            <img src="${item.img}" class="w-20 h-20 object-cover rounded-xl">
            <div class="flex-1">
              <h4>${item.nome}</h4>
              <p class="text-green-400">${item.preco.toLocaleString('pt-AO')} Kz × ${item.quantidade}</p>
            </div>
            <div>
              <button onclick="removerDoCarrinho(${index})" class="text-red-500 text-2xl">✕</button>
              <p class="font-bold mt-4">${(item.preco * item.quantidade).toLocaleString('pt-AO')} Kz</p>
            </div>
          </div>
        `;
      });

      document.getElementById('cart-total').textContent = total.toLocaleString('pt-AO') + ' Kz';
    }

    function removerDoCarrinho(index) {
      carrinho.splice(index, 1);
      renderCart();
      atualizarCarrinho();
    }

    function finalizarCompra() {
      if (carrinho.length === 0) return;
      alert("✅ Compra realizada com sucesso!\n\nObrigado por comprar na Dilson Negócios 🎮\n\nProjeto Escolar - Simulação");
      carrinho = [];
      atualizarCarrinho();
      toggleCart();
    }

    // Iniciar a renderização assim que carregar
    window.onload = function() {
      renderProdutos();
    };
  </script>
</body>
</html>
